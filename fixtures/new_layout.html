<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Demo Shop – Coffee Gear</title></head>
<body>
  <!-- Layout after the shop's redesign: new class names, thousands separators,
       European price format on some items, an out-of-stock product with no price,
       and product names with non-ASCII characters. -->
  <section class="catalog">
    <article class="product" data-sku="HG-01">
      <h2 class="product-name">Hand Grinder Classic</h2>
      <div class="pricing"><p class="price-current">$49.90</p></div>
    </article>
    <article class="product" data-sku="EM-PRO">
      <h2 class="product-name">Espresso Machine Pro</h2>
      <div class="pricing"><p class="price-current">$1,299.00</p></div>
    </article>
    <article class="product" data-sku="CF-SET">
      <h2 class="product-name">Café Cup Set (6 pcs)</h2>
      <div class="pricing"><p class="price-current">€24,90</p></div>
    </article>
    <article class="product" data-sku="KT-POUR">
      <h2 class="product-name">Pour-Over Kettle</h2>
      <div class="pricing"><span class="stock">Out of stock</span></div>
    </article>
    <article class="product" data-sku="GR-ELEC">
      <h2 class="product-name">Kaffeemühle Elektrisch</h2>
      <div class="pricing"><p class="price-current">€1.149,00</p></div>
    </article>
  </section>
</body>
</html>
